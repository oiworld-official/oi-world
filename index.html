<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171923">
<title>OI WORLD — Your Industry. Your World.</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Orbitron:wght@500;600;700;800&display=swap');
:root{--ink:#191b29;--muted:#727990;--pink:#ec5ca8;--lav:#d9b9ef;--ice:#c9e5f7;--paper:#edf2fa;--white:#fff;--line:#dfe5f0;--shadow:0 12px 35px #28324c16}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 12% 8%,#f8d9ee 0,transparent 24%),radial-gradient(circle at 90% 22%,#d4e9fb 0,transparent 28%),#eaf0f9;color:var(--ink);font-family:Manrope,Arial,sans-serif;min-height:100vh}button,input,textarea,select{font:inherit}button{cursor:pointer}.shell{max-width:1220px;margin:auto;padding:18px}.top{background:linear-gradient(115deg,#171923,#303449 58%,#50415e);color:#fff;border:1px solid #ffffff55;border-radius:24px;padding:18px 22px;box-shadow:0 18px 40px #20283e30;position:relative;overflow:hidden}.top:after{content:'✦';position:absolute;right:7%;top:-38px;font-size:180px;color:#ffffff0d}.brand{font:800 25px Orbitron,sans-serif;letter-spacing:1px}.brand span{color:#ff8bc5}.tag{font-size:10px;letter-spacing:2px;color:#d8e5f6;margin-top:5px}.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative;z-index:1}.status{border:1px solid #8bd9b7;color:#a9f1cf;border-radius:99px;padding:6px 10px;font-size:10px;letter-spacing:1px}.hero{padding:34px 0 16px;max-width:760px;position:relative;z-index:1}.hero h1{font:800 clamp(28px,5vw,52px) Orbitron,sans-serif;margin:0 0 12px;line-height:1.1}.hero p{color:#d9e0ee;margin:0;max-width:590px}.chrome{background:linear-gradient(110deg,#fff 0,#dce6f2 18%,#fff 31%,#aebbd0 45%,#fff 60%,#c5d0e2 78%,#fff);background-clip:text;color:transparent}.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px;margin-top:16px}.nav,.panel,.sidecard{background:#ffffffdb;border:1px solid #fff;border-radius:20px;box-shadow:var(--shadow);backdrop-filter:blur(12px)}.nav{padding:12px;height:max-content;position:sticky;top:12px}.nav small{display:block;color:#9097aa;font-size:10px;font-weight:800;letter-spacing:1.5px;padding:9px 10px}.nav button{width:100%;border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:12px;color:#4c536a;font-weight:700;font-size:13px;margin:2px 0}.nav button:hover,.nav button.active{background:linear-gradient(100deg,#f3d9ee,#dce9f9);color:#292a42}.nav .ownerlink{margin-top:10px;background:#24263a;color:#fff}.main{min-width:0}.panel{padding:20px;margin-bottom:14px}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.sectionhead h2{font:700 19px Orbitron,sans-serif;margin:0}.eyebrow{font-size:10px;letter-spacing:1.5px;color:#8a91a6;font-weight:800}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.tile{border:1px solid #e5e8f1;border-radius:16px;padding:15px;background:linear-gradient(145deg,#fff,#f0f3fa)}.tile h3{margin:7px 0 5px;font-size:14px}.tile p{font-size:12px;color:var(--muted);margin:0;line-height:1.55}.ico{font-size:22px}.btn{border:0;border-radius:12px;padding:11px 15px;background:linear-gradient(110deg,#ed69ae,#c7a6ed);color:#fff;font-weight:800;font-size:12px;box-shadow:0 5px 14px #d17cb044}.btn.secondary{background:#edf1f8;color:#414961;box-shadow:none;border:1px solid #e1e6f0}.btn.dark{background:#24263a}.btn:disabled{opacity:.45;cursor:not-allowed}.field{width:100%;border:1px solid #dfe4ef;border-radius:12px;padding:12px;background:#fbfcff;outline:none;color:#282c42;margin:5px 0 11px}.field:focus{border-color:#d18bc0;box-shadow:0 0 0 3px #f6dced}.label{font-size:11px;color:#626a81;font-weight:800}.pill{display:inline-flex;padding:5px 9px;border-radius:99px;background:#f2e3f5;color:#77518c;font-size:10px;font-weight:800;letter-spacing:.4px}.pill.green{background:#e0f5eb;color:#327b5a}.profilecover{height:120px;border-radius:15px;background:radial-gradient(circle at 70% 25%,#fff9 0 2px,transparent 4px),radial-gradient(circle at 20% 70%,#fff8 0 2px,transparent 4px),linear-gradient(115deg,#202335,#6b547d 50%,#8fc6df);background-size:35px 35px,48px 48px,auto}.avatar{width:68px;height:68px;border-radius:20px;background:linear-gradient(140deg,#f7d9ed,#b9d7f1);display:grid;place-items:center;font-size:30px;border:4px solid white;box-shadow:0 5px 18px #323b5520}.profiletop{display:flex;align-items:end;gap:12px;margin-top:-36px;padding:0 12px;position:relative}.profiletop h2{margin:0;font-size:19px}.muted{color:var(--muted);font-size:12px}.post{border:1px solid #e6e9f1;border-radius:16px;padding:14px;margin:10px 0;background:#fff}.posthead{display:flex;align-items:center;gap:9px}.miniavatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(140deg,#f3d5ed,#d0e7f7)}.posttext{font-size:13px;line-height:1.6;margin:12px 0}.postactions{display:flex;gap:8px;align-items:center}.postactions button{border:0;background:#f2f4f9;border-radius:9px;padding:7px 10px;color:#596078;font-size:11px;font-weight:700}.chatlist{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.chatlist button{border:1px solid #e0e5ef;background:#f4f6fb;border-radius:12px;padding:9px 12px;font-size:12px;font-weight:700;color:#4c536a}.chatlist button.active{background:#e9d9f2;border-color:#d5b3e4}.bubble{max-width:85%;background:#eef2fa;border-radius:14px;padding:10px 12px;font-size:12px;margin:7px 0}.bubble.mine{margin-left:auto;background:#eadcf3}.msgrow{display:flex;gap:8px}.msgrow .field{margin:0}.notice{padding:10px 12px;background:#fff7df;border:1px solid #f4e3ad;color:#75602b;border-radius:12px;font-size:11px;line-height:1.5}.rank{font:700 24px Orbitron,sans-serif;color:#72539a}.footer{text-align:center;color:#8991a6;font-size:10px;letter-spacing:1.5px;padding:20px}.hidden{display:none!important}.empty{text-align:center;padding:28px 12px;color:#838ba0;font-size:12px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#202337;color:white;padding:11px 16px;border-radius:12px;font-size:12px;box-shadow:var(--shadow);z-index:5}.ownerhero{background:linear-gradient(120deg,#25243b,#67547b);color:white;border-radius:16px;padding:17px}.ownerhero h2{font:800 21px Orbitron;margin:8px 0}.stat{background:#f1e9f7;border-radius:13px;padding:12px}.stat b{font:700 20px Orbitron;color:#76528f;display:block}.stat span{font-size:10px;color:#737990}
@media(max-width:760px){.layout{grid-template-columns:1fr}.nav{position:static;display:flex;overflow:auto;gap:4px;padding:8px}.nav small{display:none}.nav button{white-space:nowrap;width:auto;margin:0;padding:10px}.nav .ownerlink{margin:0}.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{padding:25px 0 8px}.panel{padding:15px}.shell{padding:10px}.top{padding:15px}.grid2{grid-template-columns:1fr}}
</style></head>
<body><div class="shell">
<header class="top"><div class="toprow"><div><div class="brand">OI<span>✦</span>WORLD</div><div class="tag">ONLINE INDUSTRY NETWORK</div></div><div class="status">● BETA PREVIEW</div></div><div class="hero"><h1><span class="chrome">YOUR WORLD.<br>YOUR INDUSTRY.</span></h1><p>Создавай проекты, находи команды, знакомься с участниками и оставляй собственный след в онлайн-индустрии.</p></div></header>
<div class="layout"><aside class="nav"><small>DISCOVER</small><button data-page="home" class="active">✦ Главная</button><button data-page="profile">♛ Мой профиль</button><button data-page="feed">▤ Лента</button><button data-page="messages">✉ Сообщения</button><button data-page="people">♙ Участники</button><button data-page="projects">♫ Группы и компании</button><button data-page="create">＋ Создать проект</button><button data-page="achievements">🏆 Достижения</button><button data-page="rankings">✧ Рейтинги</button><button data-page="owner" class="ownerlink">♛ OWNER PANEL</button></aside>
<main class="main" id="app"></main></div><footer class="footer">OI WORLD ✦ MAKE YOUR OWN HISTORY · Y2K EDITION</footer></div><div id="toast" class="toast hidden"></div>
<script>
const KEY='oiworld_demo_v1';const initial={profile:{name:'FOUNDER',handle:'@oiworld.owner',bio:'Основатель и главный владелец OI WORLD. Создатель пространства, в котором развивается онлайн-индустрия.',rank:'ULTIMATE OWNER'},posts:[{author:'OI WORLD',text:'Добро пожаловать в OI WORLD! Создавайте проекты, находите команды, развивайте свои профили и становитесь частью индустрии. 💿',likes:0,official:true}],projects:[],messages:{'Requiem':[{from:'them',text:'Привет! Добро пожаловать в OI WORLD 💗'}]},achievements:['Первый шаг','Создатель','Дебют']};let state;try{state={...initial,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{state=structuredClone(initial)}let page='home',activeChat='Requiem';const app=document.getElementById('app');function save(){localStorage.setItem(KEY,JSON.stringify(state))}function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),2200)}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function go(p){page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));
function card(title,desc,ico){return `<div class="tile"><div class="ico">${ico}</div><h3>${title}</h3><p>${desc}</p></div>`}function postCard(p,i){return `<article class="post"><div class="posthead"><div class="miniavatar">${p.official?'✦':'♙'}</div><div><b style="font-size:12px">${esc(p.author)}</b><div class="muted">${p.official?'OFFICIAL PLATFORM':'COMMUNITY MEMBER'}</div></div>${p.official?'<span class="pill" style="margin-left:auto">OFFICIAL</span>':''}</div><div class="posttext">${esc(p.text)}</div><div class="postactions"><button onclick="likePost(${i})">♡ Like · ${p.likes||0}</button><span class="muted">OI WORLD COMMUNITY</span></div></article>`}
function render(){let html='';if(page==='home'){html=`<section class="panel"><div class="eyebrow">✦ FEATURED SPACE</div><h2 style="font:800 25px Orbitron;margin:8px 0">THE NEW ERA OF OI.</h2><p class="muted">Твоя цифровая площадка для творчества, карьеры и общения.</p><div class="grid3" style="margin-top:16px">${card('Участники','Создавай личные и профессиональные профили.','♙')}${card('Кавер-группы','Собирай команды и объявляй дебюты.','♫')}${card('Компании','Открывай агентства и развивай проекты.','✧')}</div></section><section class="panel"><div class="sectionhead"><h2>COMMUNITY FEED</h2><span class="pill green">OPEN</span></div>${state.posts.slice(0,3).map(postCard).join('')}</section><section class="panel"><div class="sectionhead"><h2>QUICK ACCESS</h2><span class="eyebrow">EXPLORE</span></div><div class="grid2">${card('Messenger','Личные сообщения и деловые переписки.','✉')}${card('Hall of Fame','Достижения, уровни и рейтинги.','🏆')}</div></section>`}
if(page==='feed'){html=`<section class="panel"><div class="sectionhead"><h2>COMMUNITY FEED</h2><span class="pill">POSTS</span></div><label class="label">СОЗДАТЬ ПУБЛИКАЦИЮ</label><textarea id="postText" class="field" rows="3" placeholder="Что происходит в твоём мире?"></textarea><button class="btn" onclick="addPost()">Опубликовать ✦</button></section><section class="panel">${state.posts.map(postCard).join('')}</section>`}
if(page==='profile'){html=`<section class="panel"><div class="profilecover"></div><div class="profiletop"><div class="avatar">♛</div><div><h2>${esc(state.profile.name)}</h2><div class="muted">${esc(state.profile.handle)}</div></div></div><div style="padding:12px"><span class="pill">ULTIMATE OWNER</span> <span class="pill green">VERIFIED</span><p>${esc(state.profile.bio)}</p><div class="ownerhero"><div class="eyebrow" style="color:#e6d6f3">MAXIMUM STATUS</div><h2>♛ LEVEL 100</h2><div>FOUNDER · THE CREATOR OF OI WORLD</div><p style="font-size:11px;color:#e4d9ef">MAX XP · ALL BADGES · PLATFORM OWNER</p></div><div class="grid2" style="margin-top:12px"><div class="stat"><b>100</b><span>LEVEL</span></div><div class="stat"><b>MAX</b><span>EXPERIENCE</span></div></div><h3>OWNER PRIVILEGES</h3><p class="muted">Полный доступ к настройкам, модерации, управлению проектами, участниками, наградами и верификацией.</p></div></section>`}
if(page==='messages'){let names=Object.keys(state.messages);html=`<section class="panel"><div class="sectionhead"><h2>MESSENGER ✉</h2><span class="pill green">DEMO MODE</span></div><div class="chatlist">${names.map(n=>`<button class="${activeChat===n?'active':''}" onclick="openChat('${esc(n)}')">${esc(n)}</button>`).join('')}<button onclick="newChat()">＋ Новый чат</button></div><div id="chatbox" style="background:#f6f8fc;border-radius:14px;padding:12px;min-height:170px">${(state.messages[activeChat]||[]).map(m=>`<div class="bubble ${m.from==='me'?'mine':''}">${esc(m.text)}</div>`).join('')}</div><div class="msgrow" style="margin-top:10px"><input id="messageText" class="field" placeholder="Написать сообщение..."><button class="btn" onclick="sendMessage()">➤</button></div></section>`}
if(page==='people'){html=`<section class="panel"><div class="sectionhead"><h2>УЧАСТНИКИ</h2><span class="pill">DIRECTORY</span></div><p class="muted">Здесь будут отображаться публичные профили пользователей после подключения общей базы.</p><div class="tile"><div class="ico">♛</div><h3>FOUNDER</h3><p>Основатель OI WORLD · максимальный ранг</p></div></section>`}
if(page==='projects'){html=`<section class="panel"><div class="sectionhead"><h2>GROUPS & AGENCIES</h2><button class="btn" onclick="go('create')">＋ Создать</button></div>${state.projects.length?state.projects.map(p=>`<div class="tile" style="margin-bottom:9px"><span class="pill">${esc(p.type)}</span><h3>${esc(p.name)}</h3><p>${esc(p.desc||'Описание не добавлено')}</p></div>`).join(''):'<div class="empty">Пока нет проектов. Создай первый!</div>'}</section>`}
if(page==='create'){html=`<section class="panel"><div class="sectionhead"><h2>CREATE YOUR PROJECT</h2><span class="pill">OPEN CREATION</span></div><label class="label">ТИП ПРОЕКТА</label><select id="projectType" class="field"><option>Кавер-группа</option><option>Компания / агентство</option><option>Независимый проект</option></select><label class="label">НАЗВАНИЕ</label><input id="projectName" class="field" placeholder="Например, Requiem"><label class="label">ОПИСАНИЕ</label><textarea id="projectDesc" class="field" rows="3" placeholder="Расскажи о проекте..."></textarea><button class="btn" onclick="createProject()">Создать страницу ✦</button><p class="muted">Создать проект может любой пользователь. Верификация официальной страницы — отдельная процедура.</p></section>`}
if(page==='achievements'){const all=[['Первый шаг','Создать первый профиль','10 XP','♙'],['Создатель','Создать проект','50 XP','♛'],['Дебют','Опубликовать первый дебют','100 XP','✦'],['Командный дух','Собрать команду','75 XP','♧'],['Звезда индустрии','Получить признание','200 XP','🏆'],['Легенда','Достичь высшего уровня','500 XP','💎']];html=`<section class="panel"><div class="sectionhead"><h2>ACHIEVEMENTS</h2><span class="pill">HALL OF FAME</span></div><div class="ownerhero"><div class="eyebrow" style="color:#e6d6f3">YOUR EXPERIENCE</div><h2>${state.achievements.length} BADGES</h2><p style="font-size:11px;color:#e4d9ef">Награды и карьерная история</p></div><div class="grid2" style="margin-top:12px">${all.map(a=>`<div class="tile"><div class="ico">${a[3]}</div><h3>${a[0]}</h3><p>${a[1]}</p><p style="margin-top:8px;color:#8a5c9d;font-weight:800">${a[2]}</p><span class="pill ${state.achievements.includes(a[0])?'green':''}">${state.achievements.includes(a[0])?'UNLOCKED':'LOCKED'}</span></div>`).join('')}</div></section>`}
if(page==='rankings'){html=`<section class="panel"><div class="sectionhead"><h2>HALL OF FAME</h2><span class="pill">RANKINGS</span></div><div class="ownerhero"><div class="rank" style="color:#f2d8ff">♛ #1</div><h2>FOUNDER</h2><span>ULTIMATE OWNER · OI WORLD</span></div><p class="muted" style="margin-top:12px">Публичные рейтинги участников, групп и компаний будут формироваться на основе реальной статистики и прозрачных правил.</p></section>`}
if(page==='owner'){html=`<section class="panel"><div class="sectionhead"><h2>OWNER CONTROL CENTER</h2><span class="pill green">OWNER PREVIEW</span></div><div class="ownerhero"><div class="eyebrow" style="color:#e6d6f3">ULTIMATE ACCESS</div><h2>♛ FOUNDER PANEL</h2><p style="font-size:12px;color:#e4d9ef">Панель управления OI WORLD</p></div><div class="grid2" style="margin-top:12px">${card('Пользователи','Управление участниками и профилями.','♙')}${card('Проекты','Группы, агентства и страницы.','♫')}${card('Модерация','Жалобы и публикации.','✧')}${card('Верификация','Подтверждение официальных страниц.','✓')}${card('Награды','Достижения и рейтинги.','🏆')}${card('Настройки','Конфигурация платформы.','⚙')}</div><div class="notice" style="margin-top:12px">Это демонстрационная панель. Настоящие административные права должны проверяться сервером, а не интерфейсом браузера.</div></section>`}
app.innerHTML=html}
function likePost(i){state.posts[i].likes=(state.posts[i].likes||0)+1;save();render()}function addPost(){const el=document.getElementById('postText');if(!el.value.trim())return;state.posts.unshift({author:state.profile.name,text:el.value.trim(),likes:0});save();render();toast('Публикация добавлена в демо-ленту')}function createProject(){const name=document.getElementById('projectName').value.trim();if(!name)return toast('Введи название проекта');state.projects.push({name,type:document.getElementById('projectType').value,desc:document.getElementById('projectDesc').value.trim()});state.achievements=[...new Set([...state.achievements,'Создатель'])];save();go('projects');toast('Проект создан в демо-режиме')}function openChat(n){activeChat=n;render()}function newChat(){const n=prompt('Название чата или собеседника:');if(!n)return;if(!state.messages[n])state.messages[n]=[];activeChat=n;save();render()}function sendMessage(){const el=document.getElementById('messageText');if(!el.value.trim())return;state.messages[activeChat]??=[];state.messages[activeChat].push({from:'me',text:el.value.trim()});save();render()}render();
</script></body></html>
